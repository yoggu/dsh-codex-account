# dsh-codex-account bundle layer.
#
# Eine Zeile, zwei Konten. Die Konten liegen in `config.accounts`, weil die
# Kontowahl eine Eigenschaft dieses Deployments ist und nicht des Plugins:
# eine spätere Patch-Ebene (das Profil-`cordis.patch.yml`) ersetzt die
# `config` dieser Zeile vollständig, um ein anderes Konto oder eine andere
# Routenbezeichnung zu wählen.
#
# `codex-personal` ist die Route für das persönliche ChatGPT-Konto. Die
# Provider-Namen sind frei wählbar; sie sind das, was im Model-Picker steht
# und was eine Session als `provider` nennt.
- insert:
    - id: codex-account
      name: 'dsh-codex-account'
      config:
        accounts:
          - id: personal
            provider: codex-personal
            displayName: 'Codex (persönlich)'
        transport: sse
        cacheRetention: long
        # Bild-Eingabe führt diese Route nativ: die Bytes kommen über den
        # Attachment-Dienst, gehen als pi-ai-`ImageContent` in den Context und
        # werden von pi-ai als `input_image` serialisiert. Welches Modell
        # Bilder annimmt, entscheidet der pi-ai-Katalog je Modell — hier wird
        # nur die Route als Ganzes freigeschaltet.
        readImages: true
        # Kein statischer Filter: Die Route übernimmt den vollständigen
        # pi-ai-Codex-Katalog. Neue Modelle erscheinen automatisch nach einem
        # Harness/pi-ai-Update. Falls nur verifizierte Modelle angeboten werden
        # sollen, kann eine spätere Profil-Patch-Ebene `models` setzen.
